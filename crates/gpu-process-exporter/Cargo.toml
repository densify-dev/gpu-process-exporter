[package]
name = "gpu-process-exporter"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gpu-exporter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
flate2 = "1"
form_urlencoded = "1"
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1"] }
jiff = "0.2"
k8s-openapi = { version = "0.29", features = ["v1_36"] }
kube = { version = "5.1", default-features = false, features = ["client", "runtime", "rustls-tls", "ring"] }
futures = "0.3"
nvml-wrapper-sys = "0.10"
prometheus = { version = "0.14", features = ["process", "protobuf"] }
regex = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tokio-util = "0.7"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
