services:
  metrics:
    image: python:3.12-alpine
    command: ["python3", "/app/metrics.py"]
    environment:
      PORT: "9494"
    volumes:
      - type: bind
        source: ./metrics.py
        target: /app/metrics.py
        read_only: true
    ports:
      - "127.0.0.1:9494:9494"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - type: bind
        source: ./prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - metrics

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - type: bind
        source: ./provisioning/datasource.yml
        target: /etc/grafana/provisioning/datasources/datasource.yml
        read_only: true
      - type: bind
        source: ./provisioning/dashboard.yml
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
        read_only: true
      - type: bind
        source: ../gpu-process-exporter-dashboard.json
        target: /var/lib/grafana/dashboards/gpu-process-exporter-dashboard.json
        read_only: true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
