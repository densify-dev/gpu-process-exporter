# SPDX-License-Identifier: Apache-2.0

name: Bug report
description: Report a reproducible bug
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security issues here. Use GitHub private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Kubernetes version, node OS, NVIDIA driver, GPU model, and container runtime.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
