# SPDX-License-Identifier: Apache-2.0

name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, for example v1.1.0
        required: true
        type: string
      approved:
        description: Type APPROVED after release approval
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: docker.io/densify/gpu-process-exporter

jobs:
  publish:
    outputs:
      stable: ${{ steps.version.outputs.stable }}
    runs-on: ubuntu-latest
    environment: dockerhub
    if: github.event_name == 'push' || github.event.inputs.approved == 'APPROVED'
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          case "${version}" in
            vv*) echo "Version must not have multiple leading v characters." >&2; exit 1 ;;
            v*) ;;
            *) echo "Version must start with v." >&2; exit 1 ;;
          esac
          image_tag="${version#v}"
          case "${image_tag}" in
            0.2.0-beta2|0.2.0-beta3|1.0.0|latest)
              echo "Refusing to publish historical or mutable tag ${version}." >&2
              exit 1
              ;;
          esac
          if [[ ! "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: ${image_tag}" >&2
            exit 1
          fi
          if [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable=true
          else
            stable=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "stable=${stable}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Check shell syntax
        run: bash -n build.sh build-docker-image.sh entrypoint.sh
      - name: Check formatting
        run: test -z "$(gofmt -l cmd pkg)"
      - name: Test
        run: |
          go test ./...
          go test -race ./...
          go build ./...
          make lint
      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Vulnerability scan
        run: $(go env GOPATH)/bin/govulncheck ./...
      - name: Secret scan
        run: $(go env GOPATH)/bin/gitleaks git --redact --verbose --report-format=json --report-path=gitleaks-report.json .
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build amd64 scan image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: gpu-process-exporter:scan-amd64
          build-args: |
            TARGETARCH=amd64
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.version.outputs.created }}
            SOURCE_URL=https://github.com/densify-dev/gpu-process-exporter
      - name: Build arm64 scan image
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          load: true
          push: false
          platforms: linux/arm64
          tags: gpu-process-exporter:scan-arm64
          build-args: |
            TARGETARCH=arm64
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.version.outputs.created }}
            SOURCE_URL=https://github.com/densify-dev/gpu-process-exporter
      - name: Scan amd64 image vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: gpu-process-exporter:scan-amd64
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-image-amd64.json
        env:
          TRIVY_IMAGE_SRC: docker
      - name: Scan arm64 image vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: gpu-process-exporter:scan-arm64
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-image-arm64.json
        env:
          TRIVY_IMAGE_SRC: docker
      - name: Generate amd64 SBOM
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: gpu-process-exporter:scan-amd64
          format: cyclonedx-json
          output-file: sbom-image-amd64.cyclonedx.json
          artifact-name: sbom-image-amd64.cyclonedx.json
          syft-version: v1.51.0
          upload-artifact: true
          upload-release-assets: false
      - name: Generate arm64 SBOM
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: gpu-process-exporter:scan-arm64
          format: cyclonedx-json
          output-file: sbom-image-arm64.cyclonedx.json
          artifact-name: sbom-image-arm64.cyclonedx.json
          syft-version: v1.51.0
          upload-artifact: true
          upload-release-assets: false
      - name: Log in to Docker Hub
        if: always()
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Scan amd64 image with Docker Scout
        if: always()
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: local://gpu-process-exporter:scan-amd64
          platform: linux/amd64
          only-severities: high,critical
          only-fixed: true
          exit-code: true
          sarif-file: docker-scout-image-amd64.sarif
      - name: Scan arm64 image with Docker Scout
        if: always()
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: local://gpu-process-exporter:scan-arm64
          platform: linux/arm64
          only-severities: high,critical
          only-fixed: true
          exit-code: true
          sarif-file: docker-scout-image-arm64.sarif
      - name: Upload private scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-scan-reports
          path: |
            gitleaks-report.json
            trivy-image-amd64.json
            trivy-image-arm64.json
            docker-scout-image-amd64.sarif
            docker-scout-image-arm64.sarif
          if-no-files-found: ignore
      - name: Publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.image_tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.version.outputs.created }}
            SOURCE_URL=https://github.com/densify-dev/gpu-process-exporter
      - name: Report digest
        run: echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

  github-release:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.publish.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
          else
            gh release create "${TAG}" --verify-tag --generate-notes
          fi
