name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: KineticCafe/actions-dco@a52e56727ec21d6cdba26513826e1ae4a752d2fc # v3.2.1
        with:
          config: |
            [bot]
            policy = "allowlist"
            allow = ["dependabot[bot]"]
