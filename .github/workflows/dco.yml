# SPDX-License-Identifier: Apache-2.0

name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: KineticCafe/actions-dco@5f160e3ee086af8fc0fb567b8add0937d074123e # v3.2.0
        with:
          config: |
            [bot]
            policy = "allowlist"
            allow = ["dependabot[bot]"]
