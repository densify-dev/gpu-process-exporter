# SPDX-License-Identifier: Apache-2.0

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Check shell syntax
        run: |
          for script in build.sh build-docker-image.sh entrypoint.sh .github/scripts/*.sh parity/*.sh; do
            bash -n "$script"
          done
      - name: Test Helm chart release updates
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Lint, advisories, licenses, and test map
        run: make lint
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Install Gitleaks
        run: .github/scripts/install-gitleaks.sh
      - name: Secret scan
        run: gitleaks git --redact --verbose --report-format=json --report-path=gitleaks-report.json .
      - name: Build image without pushing
        run: |
          docker build --build-arg TARGETARCH=amd64 \
            --build-arg VERSION=dev \
            --build-arg "REVISION=$(git rev-parse HEAD)" \
            -t gpu-process-exporter:ci .
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: gpu-process-exporter:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Rust
        run: rustup toolchain install
      - name: Rust against the Go goldens, 5 runs
        run: make parity PARITY_ARGS="--runs 5"
