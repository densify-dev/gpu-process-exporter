# SPDX-License-Identifier: Apache-2.0

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Check shell syntax
        run: bash -n build.sh build-docker-image.sh entrypoint.sh
      - name: Check formatting
        run: test -z "$(gofmt -l cmd pkg)"
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build packages
        run: go build ./...
      - name: Lint
        run: make lint
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Vulnerability scan
        run: $(go env GOPATH)/bin/govulncheck ./...
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Secret scan
        run: $(go env GOPATH)/bin/gitleaks git --redact --verbose --report-format=json --report-path=gitleaks-report.json .
      - name: Build image without pushing
        run: docker build --build-arg TARGETARCH=amd64 -t gpu-process-exporter:ci .
      - name: Install Trivy
        run: |
          set -euo pipefail
          version=0.74.0
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz" -o "${tmp}/trivy.tar.gz"
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  ${tmp}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "${tmp}/trivy.tar.gz" -C "${tmp}" trivy
          install -m 0755 "${tmp}/trivy" "$(go env GOPATH)/bin/trivy"
      - name: Scan image vulnerabilities
        run: $(go env GOPATH)/bin/trivy image --severity HIGH,CRITICAL --exit-code 1 --format table gpu-process-exporter:ci
